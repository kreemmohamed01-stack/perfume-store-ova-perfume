*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-card:#ffffff;--gold:#8b6a33;--shadow-soft:0 22px 48px rgba(78,53,34,.12);--shadow-hover:0 28px 58px rgba(55,34,20,.18)}
body{font-family:'Manrope',sans-serif;background:linear-gradient(180deg,#fbf8f4 0%,#ffffff 42%,#f4efe8 100%);color:#111;min-height:100vh}
@media (max-width:700px){body{padding-bottom:calc(132px + env(safe-area-inset-bottom, 0px))}}
body.modal-open{position:fixed;inset:0;width:100%;overflow:hidden}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
.page-shell{width:min(1200px,calc(100% - 32px));margin:0 auto;padding:32px 0 80px}
.hero{background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);border-radius:30px;padding:30px 24px;box-shadow:0 24px 60px rgba(0,0,0,.08);text-align:center}
.eyebrow{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:#7c624f;margin-bottom:10px}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(42px,6vw,78px);letter-spacing:6px;text-transform:uppercase;margin-bottom:12px;color:#2c211c;line-height:.95;text-shadow:0 10px 25px rgba(139,106,51,.12)}
.hero p{font-size:14px;color:#6d5a51}
.page-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0 18px;flex-wrap:wrap}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;flex:1 1 720px}
.search-box{flex:1 1 250px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:11px 14px;box-shadow:0 14px 30px rgba(0,0,0,.06)}
.search-box span{position:relative;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 14px;color:#6d5a51;font-size:0;line-height:0;overflow:hidden;text-indent:-9999px}
.search-box span::before{content:"";width:9px;height:9px;border:1.6px solid currentColor;border-radius:50%;display:block}
.search-box span::after{content:"";position:absolute;width:5px;height:1.6px;background:currentColor;border-radius:999px;transform:translate(4px,4px) rotate(45deg);transform-origin:center}
.search-box input{width:100%;border:none;outline:none;background:transparent;font-size:14px}
.filter-select,.back-link,.cart-trigger{border:none;border-radius:18px;padding:14px 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:15px;box-shadow:0 14px 30px rgba(0,0,0,.1)}
.filter-select,.back-link{background:#fff;color:#111;border:1px solid rgba(0,0,0,.08)}
.cart-trigger{background:#111;color:#fff;cursor:pointer}
.cart-count-badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#fff;color:#111;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px}
@keyframes cardReveal{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes productBottleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes badgePulse{0%,100%{box-shadow:0 16px 28px rgba(43,31,20,.18)}50%{box-shadow:0 20px 36px rgba(43,31,20,.24)}}
.product-card{position:relative;background:radial-gradient(circle at top left, rgba(255,255,255,.96) 0%, rgba(255,255,255,0) 34%),linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(248,242,233,.98) 52%, rgba(241,231,216,.96) 100%);border:1px solid rgba(139,106,51,.14);border-radius:30px;padding:18px 16px 18px;text-align:center;overflow:hidden;box-shadow:var(--shadow-soft);isolation:isolate;backdrop-filter:blur(12px);transform-origin:center bottom;will-change:transform,box-shadow;animation:cardReveal .72s cubic-bezier(.22,1,.36,1) both;transition:transform .55s cubic-bezier(.22,1,.36,1),box-shadow .55s cubic-bezier(.22,1,.36,1),border-color .4s ease,background .45s ease}
.product-card:hover{transform:translateY(-16px) scale(1.02);box-shadow:0 34px 64px rgba(62,40,24,.2);border-color:rgba(139,106,51,.42)}
.product-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top, rgba(255,228,179,.34), transparent 34%),linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 42%, rgba(214,190,153,.14) 100%);pointer-events:none;opacity:.9;transition:opacity .45s ease, transform .6s ease}
.product-card::after{content:"";position:absolute;inset:-25% auto auto -15%;width:76%;height:76%;background:radial-gradient(circle, rgba(255,240,208,.52) 0%, rgba(255,240,208,0) 68%);opacity:.55;transform:translate3d(0,0,0);transition:transform .65s cubic-bezier(.22,1,.36,1), opacity .45s ease;pointer-events:none;z-index:0}
.product-card:hover::before{opacity:1;transform:scale(1.02)}
.product-card:hover::after{opacity:.88;transform:translate3d(22px,-14px,0) scale(1.08)}
.product-card img{position:relative;z-index:1;width:100%;height:230px;object-fit:contain;cursor:pointer;transform-origin:center bottom;transition:transform .55s cubic-bezier(.22,1,.36,1), filter .55s ease;filter:drop-shadow(0 20px 22px rgba(34,20,13,.18))}
.product-card img:hover,.product-card:hover img{transform:scale(1.12) translateY(-10px) rotate(-2deg);filter:drop-shadow(0 28px 28px rgba(34,20,13,.22))}
.product-card h3{position:relative;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.05;min-height:58px;margin:10px 0 6px;color:#2c211c}
.product-card p{font-size:19px;font-weight:700;margin-bottom:8px}
.product-card .product-price,#modalPrice{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.product-old-price{color:#9a8b82;font-size:.82em;text-decoration:line-through;text-decoration-thickness:1.8px}
.product-current-price{color:#3c2b1f;font-weight:800}
.product-savings{flex-basis:100%;text-align:center;color:#8b6a33;font-size:12px;font-weight:800;letter-spacing:.2px}
.product-rating{margin-top:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.product-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.product-stats span{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(139,106,51,.14);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#5b4a41;font-weight:700}
.product-highlight-badge{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:linear-gradient(135deg, rgba(32,26,20,.94) 0%, rgba(96,71,43,.92) 100%);color:#f6e7c0;box-shadow:0 16px 28px rgba(43,31,20,.18);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;z-index:3;transition:transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s ease;animation:badgePulse 3.6s ease-in-out infinite}
.product-highlight-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#f6d47a;box-shadow:0 0 10px rgba(246,212,122,.75)}
.product-card button{position:relative;z-index:1;border:none;border-radius:999px;background:linear-gradient(135deg,#1c1715 0%,#453126 100%);color:#fff;padding:13px 18px;cursor:pointer;width:100%;margin-top:14px;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 16px 30px rgba(24,17,14,.18);transition:transform .35s ease, box-shadow .35s ease, filter .35s ease}
.product-card h3,.product-card p,.product-card .product-price,.product-rating,.product-stats{position:relative;z-index:1}
.product-stats span{transition:transform .35s ease, background .35s ease, border-color .35s ease}
.product-card:hover .product-highlight-badge,.product-card:hover .stock-badge{transform:translateY(-2px) scale(1.03)}
.product-card:hover .product-stats span{transform:translateY(-2px);background:rgba(255,255,255,.92);border-color:rgba(139,106,51,.24)}
.product-card button:hover{transform:translateY(-2px);box-shadow:0 20px 34px rgba(24,17,14,.24);filter:brightness(1.04)}
.products-grid .product-card:nth-child(3n + 2){animation-delay:.08s}
.products-grid .product-card:nth-child(3n + 3){animation-delay:.16s}
@media (prefers-reduced-motion: reduce){.product-card,.product-card img,.product-card .product-highlight-badge{animation:none !important;transition:none !important}}
.empty-state{text-align:center;padding:40px 20px;color:#6b6159}
#productModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:4000;padding:24px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal-content{background:radial-gradient(circle at top, rgba(219,197,155,.26), transparent 30%),linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(247,240,230,.98) 100%);max-width:760px;margin:40px auto;border-radius:36px;padding:28px 24px;text-align:center;position:relative;border:1px solid rgba(139,106,51,.14);box-shadow:0 34px 70px rgba(30,20,15,.24);max-height:calc(100vh - 80px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.closeModal{position:absolute;top:14px;right:18px;font-size:28px;cursor:pointer}
.modal-gallery{display:flex;flex-direction:column;gap:12px}
.modal-content img{width:100%;max-height:360px;object-fit:contain}
.modal-extra-images{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.modal-extra-images img{width:88px;height:88px;object-fit:contain;border-radius:14px;border:1px solid rgba(0,0,0,.08);background:#faf7f2;cursor:pointer}
.modal-content h2{margin:12px 0 8px;font-family:'Cormorant Garamond',serif;font-size:clamp(34px,4vw,48px);line-height:.98;color:#2c1f18}
.modal-content p{font-size:22px;font-weight:700;margin-bottom:8px}
.modal-rating{margin-top:8px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.modal-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:12px}
.modal-stats span{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(139,106,51,.12);color:#5b4a41;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.modal-offer{display:inline-flex;margin-top:8px;padding:8px 12px;border-radius:999px;background:#f3e3c7;color:#6b4423;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.qty-controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:18px}
.qty-controls button{border:none;width:38px;height:38px;border-radius:50%;background:#111;color:#fff;cursor:pointer}
.modal-add-btn{border:none;border-radius:999px;background:linear-gradient(135deg,#1c1715 0%,#453126 100%);color:#fff;padding:14px 22px;cursor:pointer;min-width:min(320px,100%);letter-spacing:2px;text-transform:uppercase}
.cart{position:fixed;top:0;right:-100%;width:min(380px,100%);height:100%;background:radial-gradient(circle at top, rgba(241,223,190,.16), transparent 26%), linear-gradient(180deg, rgba(27,20,16,.98) 0%, rgba(16,12,10,.98) 100%);color:#fff;padding:24px 18px 30px;z-index:4500;overflow-y:auto;transition:right .35s ease;border-left:1px solid rgba(255,255,255,.08);box-shadow:-26px 0 46px rgba(0,0,0,.26)}
.cart h2{margin-bottom:18px;font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:2px;color:#f7efe2}
.close-cart{display:inline-block;margin-bottom:18px;cursor:pointer;color:#f1dfbe;letter-spacing:1.5px;text-transform:uppercase;font-size:13px}
.cart-item{display:flex;gap:12px;align-items:center;margin-bottom:16px;padding:13px;border-radius:20px;background:linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.04) 100%);border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 30px rgba(0,0,0,.14)}
.cart-item img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08)}
.cart-item-details{flex:1}
.cart-item-details h4{font-size:14px;line-height:1.5;margin-bottom:4px;color:#fff}
.cart-item-details p{font-size:13px;margin-bottom:4px;color:rgba(255,255,255,.76)}
.cart-item-details button{border:none;background:linear-gradient(135deg, #f1dfbe 0%, #c79f62 100%);color:#1f140d;border-radius:999px;padding:4px 10px;cursor:pointer;margin-right:6px;font-weight:800}
.cart-total{margin-top:22px;font-size:18px;font-weight:800;color:#fff;padding:16px 18px;border-radius:20px;background:linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.05) 100%);border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 30px rgba(0,0,0,.12)}
.checkout-btn{width:100%;margin-top:18px;border:none;border-radius:20px;background:linear-gradient(135deg, #f1dfbe 0%, #c79f62 100%);color:#1f140d;padding:15px 18px;cursor:pointer;font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 18px 34px rgba(0,0,0,.2)}
.cart-trigger.cart-pulse{animation:cartPulse .72s ease}
.fly-img{position:fixed;width:96px;height:96px;object-fit:cover;border-radius:12px;pointer-events:none;z-index:5000;animation:flyToCart .6s forwards}
@keyframes cartPulse{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes flyToCart{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media (max-width:640px){
  .page-shell{width:min(100% - 20px,1200px);padding-top:20px}
  .hero{padding:24px 18px}
  .hero h1{font-size:42px;letter-spacing:3px}
  .page-top{display:grid;grid-template-columns:1fr auto;align-items:center;position:static;top:auto;z-index:auto;padding:0;border-radius:0;background:transparent;backdrop-filter:none;box-shadow:none}
  .page-top.is-cart-focus{position:sticky;top:10px;z-index:1200;padding:10px;border-radius:22px;background:rgba(251,248,244,.92);backdrop-filter:blur(12px);box-shadow:0 14px 28px rgba(0,0,0,.08)}
  .controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:8px}
  .back-link{width:100%;justify-content:center}
  .cart-trigger{min-width:112px;justify-content:center;justify-self:end;padding:11px 14px}
  .controls{grid-column:1 / -1}
  .search-box,.filter-select{width:100%}

  .search-box span{width:10px;height:10px;flex-basis:10px}
  .search-box span::before{width:6px;height:6px;border-width:1.3px}
  .search-box span::after{width:4px;height:1.3px;transform:translate(3px,3px) rotate(45deg)}
  .search-box input{font-size:11px}
  .filter-select{padding:10px 12px;font-size:12px;border-radius:14px}
  .products-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .product-card{padding:14px 10px 14px;border-radius:24px}

.filter-section{background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:18px;padding:18px 16px;margin-bottom:26px;box-shadow:0 14px 30px rgba(0,0,0,0.06)}

<script>
const unisexProducts = Array.isArray(window.ovaUnisexProducts) ? window.ovaUnisexProducts : [];
window.unisexProducts = unisexProducts;
const cart = JSON.parse(localStorage.getItem("ovaCart") || "[]");
const mostRequestedProductNames = new Set([
  "Diamond Emerald Soul 200ml",
  "Nude Coral Diamond",
  "Lahab - Hersh",
  "Stronger With You Intensely",
  "Khamrah Classic"
]);
let currentProduct = null;
let modalQty = 1;
let currentLang = localStorage.getItem("ovaLang") || "en";
const pendingProductQuery = new URLSearchParams(window.location.search).get("product") || "";
let cartBarFocusTimer = null;
let modalScrollLockY = 0;

function inferType(name, price, detailText = ""){
  const lower = `${name || ""} ${detailText || ""}`.toLowerCase();
  if(lower.includes("vanilla") || lower.includes("opium") || lower.includes("khamra") || lower.includes("khamrah") || lower.includes("sweet") || lower.includes("caramel") || lower.includes("gourmand") || lower.includes("marshmallow") || lower.includes("chocolate") || lower.includes("candy") || lower.includes("praline") || lower.includes("tonka")) return "sweet";
  if(lower.includes("tobacco") || lower.includes("oud") || lower.includes("night") || lower.includes("elixir") || lower.includes("spicy") || lower.includes("warm") || lower.includes("amber") || lower.includes("oriental") || lower.includes("incense") || lower.includes("leather") || lower.includes("smoky") || lower.includes("smoke") || lower.includes("intense") || lower.includes("intensely") || lower.includes("absolu") || lower.includes("absolutely")) return "evening";
  if(lower.includes("fresh") || lower.includes("citrus") || lower.includes("marine") || lower.includes("aqua") || lower.includes("aquatic") || lower.includes("bergamot") || lower.includes("green") || lower.includes("mint") || lower.includes("watery") || lower.includes("bleu de chanel") || lower.includes("acqua") || lower.includes("imagination") || lower.includes("issey") || lower.includes("sauvage") || lower.includes("y eau") || lower.includes("freeze") || lower.includes("sport")) return "fresh";
  if(lower.includes("musk") || lower.includes("musky") || lower.includes("powder") || lower.includes("powdery") || lower.includes("clean")) return "daily";
  if(price <= 1000) return "daily";
  if(price >= 1700 || lower.includes("reserve") || lower.includes("velvet")) return "luxury";
  return "luxury";
}

function inferLongevity(type, price){
  if(type === "evening" || price >= 1800) return "10-12h";
  if(type === "sweet" || type === "luxury") return "8-10h";
  if(type === "fresh") return "6-8h";
  return "5-7h";
}

function inferSillage(type, price){
  if(type === "evening" || type === "luxury" || price >= 1600) return "Strong";
  if(type === "sweet") return "Moderate";
  if(type === "fresh") return "Fresh trail";
  return "Soft";
}

function inferRating(type, price, index){
  const base = price >= 1500 ? 4.8 : price >= 1000 ? 4.6 : 4.4;
  const typeBoost = type === "luxury" ? 0.1 : type === "evening" ? 0.05 : 0;
  return Math.min(5, base + typeBoost + ((index % 3) * 0.05)).toFixed(1);
}

function decorateProducts(list){
  list.forEach((product, index) => {
    const sourceType = String(product.type || "").trim();
    const type = inferType(product.name || "", product.price || 850, sourceType);
    if(sourceType && !["sweet", "fresh", "daily", "luxury", "evening"].includes(sourceType.toLowerCase())){
      product.detailType = sourceType;
    }
    product.type = type;
    product.longevity = inferLongevity(type, product.price || 850);
    product.sillage = inferSillage(type, product.price || 850);
    product.rating = inferRating(type, product.price || 850, index);
    product.stock = 18;
  });
}

function getOriginalPrice(product){
  const basePrice = Number(product?.price) || 0;
  const name = String(product?.name || "");
  let hash = 0;

  for(let i = 0; i < name.length; i += 1){
    hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  }

  const increments = [150, 200, 250, 300, 350, 400, 450, 500, 550, 600];
  return basePrice + increments[hash % increments.length];
}

function getSavingsAmount(product){
  return Math.max(0, getOriginalPrice(product) - (Number(product?.price) || 0));
}

function getSavingsText(product){
  const savings = getSavingsAmount(product);
  return currentLang === "ar" ? `وفرت ${savings} EGP` : `You saved ${savings} EGP`;
}

function getPriceMarkup(product){
  return `
    <span class="product-old-price">${getOriginalPrice(product)} EGP</span>
    <span class="product-current-price">${product.price} EGP</span>
    <span class="product-savings">${getSavingsText(product)}</span>
  `;
}

function getStars(rating){
  const fullStars = Math.round(Number(rating));
  return "\u2605".repeat(fullStars) + "\u2606".repeat(5 - fullStars);
}

function mergeProductData(target, source){
  if(!target || !source) return target;
  Object.entries(source).forEach(([key, value]) => {
    if(value === undefined || value === null || value === "") return;
    target[key] = value;
  });
  return target;
}

function extractArrayLiteral(source, variableName){
  const match = source.match(new RegExp(`const\\s+${variableName}\\s*=\\s*(\\[[\\s\\S]*?\\]);`));
  if(!match) return [];
  try {
    return Function(`"use strict"; return (${match[1]});`)();
  } catch (error) {
    console.error(`Failed to parse ${variableName}`, error);
    return [];
  }
}

function extractObjectLiteral(source, variableName){
  const match = source.match(new RegExp(`const\\s+${variableName}\\s*=\\s*(\\{[\\s\\S]*?\\});`));
  if(!match) return {};
  try {
    return Function(`"use strict"; return (${match[1]});`)();
  } catch (error) {
    console.error(`Failed to parse ${variableName}`, error);
    return {};
  }
}

function buildIframeMarkupLoader(pagePath){
  return new Promise((resolve, reject) => {
    const iframe = document.createElement("iframe");
    iframe.src = pagePath;
    iframe.hidden = true;
    iframe.setAttribute("aria-hidden", "true");

    const cleanup = () => {
      if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
    };

    iframe.onload = () => {
      try {
        const doc = iframe.contentDocument;
        if(!doc || !doc.documentElement) throw new Error(`Missing iframe document for ${pagePath}`);
        const markup = doc.documentElement.outerHTML;
        cleanup();
        resolve(markup);
      } catch (error) {
        cleanup();
        reject(error);
      }
    };

    iframe.onerror = () => {
      cleanup();
      reject(new Error(`Failed to load ${pagePath} via iframe`));
    };

    document.body.appendChild(iframe);
  });
}

async function loadPageMarkup(pagePath){
  try {
    const response = await fetch(pagePath);
    if(!response.ok) throw new Error(`Failed to fetch ${pagePath}: ${response.status}`);
    return await response.text();
  } catch (error) {
    return buildIframeMarkupLoader(pagePath);
  }
}

function applyDetailsMap(detailMap){
  unisexProducts.forEach((product) => {
    const details = detailMap[product.name];
    if(!details) return;
    const detailType = details.type;
    mergeProductData(product, details);
    if(detailType) product.detailType = detailType;
  });
}

function applySourceProducts(sourceProducts){
  unisexProducts.forEach((product) => {
    const source = sourceProducts.find((item) => item && item.name === product.name);
    if(!source) return;
    mergeProductData(product, source);
  });
}

async function hydrateUnisexProductsFromSite(){
  try {
    if(window.ovaRemoteCatalog){
      try {
        const remoteProducts = await window.ovaRemoteCatalog.fetchProducts();
        const normalizedRemoteProducts = window.ovaRemoteCatalog.normalizeProducts(remoteProducts);
        const remoteUnisexProducts = normalizedRemoteProducts.filter((product) => product.category === "unisex");
        if(remoteUnisexProducts.length){
          if(window.ovaRemoteCatalog.syncArray){
            window.ovaRemoteCatalog.syncArray(unisexProducts, remoteUnisexProducts.map((product) => ({ ...product })));
          } else {
            unisexProducts.splice(0, unisexProducts.length, ...remoteUnisexProducts.map((product) => ({ ...product })));
          }

          const remoteBrandCatalog = window.ovaRemoteCatalog.groupBrandCatalog(remoteProducts, window.ovaBrandCatalog || {});
          if(window.ovaBrandCatalog){
            window.ovaRemoteCatalog.syncObject(window.ovaBrandCatalog, remoteBrandCatalog);
          }

          decorateProducts(unisexProducts);
          unisexProducts.forEach((product) => {
            product.filterTypes = deriveFilterTypes(product);
          });

          applyLanguage();

          const modal = document.getElementById("productModal");
          if(modal && modal.style.display === "block" && currentProduct && currentProduct.name){
            openModal(currentProduct.name);
          }
          return;
        }
      } catch (remoteError) {
        console.warn("Remote catalog unavailable for unisex page, using static fallback.", remoteError);
      }
    }

    const [indexHtml, brandHtml] = await Promise.all([
      loadPageMarkup("index.html"),
      loadPageMarkup("brand.html")
    ]);

    const indexArrayNames = [
      "bestSellerProducts",
      "extraBestSellerProducts",
      "standaloneSectionProducts"
    ];

    const indexProducts = indexArrayNames.flatMap((name) => extractArrayLiteral(indexHtml, name));
    const brandProducts = Object.values(window.ovaBrandCatalog || {}).flatMap((brand) => (brand && brand.products) || []);

    applySourceProducts([...indexProducts, ...brandProducts]);
    applyDetailsMap(extractObjectLiteral(indexHtml, "productDetailMap"));
    applyDetailsMap(extractObjectLiteral(brandHtml, "sharedProductDetailMap"));

    decorateProducts(unisexProducts);
    unisexProducts.forEach((product) => {
      product.filterTypes = deriveFilterTypes(product);
    });

    applyLanguage();

    const modal = document.getElementById("productModal");
    if(modal && modal.style.display === "block" && currentProduct && currentProduct.name){
      openModal(currentProduct.name);
    }
  } catch (error) {
    console.error("Failed to hydrate unisex products from site pages", error);
  }
}

decorateProducts(unisexProducts);

const unisexTypeOrder = ["sweet", "fresh", "fruity", "floral", "spicy", "oud", "woody", "musk", "luxury"];

function deriveFilterTypes(product){
  const combined = `${product.name || ""} ${product.detailType || product.type || ""} ${product.detailsHtml || ""}`.toLowerCase();
  const matches = [];

  if(combined.includes("vanilla") || combined.includes("sweet") || combined.includes("sugar") || combined.includes("caramel") || combined.includes("gourmand") || combined.includes("marshmallow") || combined.includes("chocolate")) matches.push("sweet");
  if(combined.includes("fresh") || combined.includes("citrus") || combined.includes("marine") || combined.includes("aqua") || combined.includes("bergamot") || combined.includes("green") || combined.includes("mint") || combined.includes("watery")) matches.push("fresh");
  if(combined.includes("fruity") || combined.includes("pear") || combined.includes("tropical") || combined.includes("apple") || combined.includes("berry")) matches.push("fruity");
  if(combined.includes("floral") || combined.includes("rose") || combined.includes("jasmine") || combined.includes("flower") || combined.includes("peony") || combined.includes("iris") || combined.includes("lavender")) matches.push("floral");
  if(combined.includes("spicy") || combined.includes("spice") || combined.includes("amber") || combined.includes("oriental") || combined.includes("warm") || combined.includes("incense")) matches.push("spicy");
  if(combined.includes("oud")) matches.push("oud");
  if(combined.includes("woody") || combined.includes("wood") || combined.includes("cedar") || combined.includes("sandal") || combined.includes("leather") || combined.includes("smoky") || combined.includes("smoke") || combined.includes("tobacco") || combined.includes("patchouli")) matches.push("woody");
  if(combined.includes("musk") || combined.includes("musky") || combined.includes("powder") || combined.includes("powdery") || combined.includes("clean")) matches.push("musk");

  if(!matches.length){
    const fallbackType = inferType(product.name || "", product.price || 0, combined);
    if (fallbackType === "sweet" || fallbackType === "fresh" || fallbackType === "luxury") matches.push(fallbackType);
    else if (fallbackType === "evening") matches.push("spicy");
    else if (fallbackType === "daily") matches.push("musk");
    else matches.push("woody");
  }

  return [...new Set(matches)];
}

function getDisplayType(product){
  const rawType = String(product.detailType || product.type || "").trim();
  if(!rawType) return "";
  return /[\/-]/.test(rawType) ? rawType : formatTypeLabel(rawType);
}

unisexProducts.forEach((product) => {
  product.filterTypes = deriveFilterTypes(product);
});

function getModalDetailsButtonText(isOpen = false){
  if(currentLang === "ar") return isOpen ? "إخفاء التفاصيل" : "مزيد من التفاصيل";
  return isOpen ? "Hide Details" : "View Details";
}

function getFilteredProducts() {
  const searchValue = document.getElementById("productSearch").value.trim().toLowerCase();
  const typeValue = document.getElementById("typeFilter").value;
  const priceValue = document.getElementById("priceFilter").value;

  return unisexProducts.filter((product) => {
    const matchesSearch = !searchValue || product.name.toLowerCase().includes(searchValue);
    const matchesType = typeValue === "all" || (product.filterTypes || []).includes(typeValue);

    let matchesPrice = true;
    if (priceValue === "below1000") matchesPrice = product.price < 1000;
    if (priceValue === "1000-1499") matchesPrice = product.price >= 1000 && product.price < 1500;
    if (priceValue === "1500-1999") matchesPrice = product.price >= 1500 && product.price < 2000;
    if (priceValue === "2000plus") matchesPrice = product.price >= 2000;

    return matchesSearch && matchesType && matchesPrice;
  });
}

function renderModalGallery(images, activeIndex = 0){
  const validImages = images.filter(Boolean);
  const mainImg = document.getElementById("modalImg");
  const gallery = document.getElementById("modalExtraImages");
  gallery.innerHTML = "";
  if(!validImages.length) return;
  const safeIndex = Math.max(0, Math.min(activeIndex, validImages.length - 1));
  mainImg.src = validImages[safeIndex];
  validImages.forEach((imageSrc, index) => {
    if(index === safeIndex) return;
    const thumb = document.createElement("img");
    thumb.src = imageSrc;
    thumb.onclick = () => renderModalGallery(validImages, index);
    gallery.appendChild(thumb);
  });
}

function renderProducts(){
  const grid = document.getElementById("productsGrid");
  const emptyState = document.getElementById("emptyState");
  const visibleProducts = getFilteredProducts();
  if (!grid || !emptyState) return;
  grid.innerHTML = "";

  if (!visibleProducts.length) {
    emptyState.style.display = "block";
    return;
  }

  emptyState.style.display = "none";
  visibleProducts.forEach((product) => {
    const card = document.createElement("div");
    card.className = "product-card";
    
    // Stock badge logic
    let stockClass = "out-stock";
    let stockText = "Out of Stock";
    if (product.stock > 5) {
      stockClass = "in-stock";
      stockText = "In Stock";
    } else if (product.stock > 0) {
      stockClass = "low-stock";
      stockText = "Low Stock";
    }
    
    card.innerHTML = `
      ${mostRequestedProductNames.has(product.name) ? '<div class="product-highlight-badge">&#1575;&#1604;&#1571;&#1603;&#1579;&#1585; &#1591;&#1604;&#1576;&#1575;</div>' : ""}
      <div class="stock-badge ${stockClass}">${stockText}</div>
      <img src="${product.img || ""}" alt="${product.name}">
      <h3>${product.name}</h3>
      <p class="product-price">${getPriceMarkup(product)}</p>
      <div class="product-rating">${getStars(product.rating)} ${product.rating}</div>
      <div class="product-stats">
        <span>${product.longevity}</span>
        <span>${product.sillage}</span>
        <span>${getDisplayType(product)}</span>
      </div>
      <button type="button">${t("add")}</button>
    `;
    const img = card.querySelector("img");
    const button = card.querySelector("button");
    img.onclick = () => openModal(product.name);
    button.onclick = () => addToCart(product.name, 1, img);
    grid.appendChild(card);
  });

  if(typeof window.refreshOvaScrollReveal === "function"){
    window.refreshOvaScrollReveal();
  }
}

function openProductPage(product){
  if(!product || !product.name) return;
  try{
    sessionStorage.setItem("ovaSelectedProduct", JSON.stringify(product));
  }catch(error){}
  const productSlug = String(product.slug || "")
    .trim()
    .toLowerCase()
    .replace(/['"]/g, "")
    .replace(/[^a-z0-9\u0600-\u06FF]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 120);
  window.location.href = `index.html?product_slug=${encodeURIComponent(productSlug || product.name)}`;
}

function openModal(name){
  const product = unisexProducts.find((item) => item.name === name);
  if(!product) return;
  openProductPage({
    ...product,
    section: "unisex"
  });
}

function openPendingProductFromQuery(){
  if(!pendingProductQuery) return;
  const productName = decodeURIComponent(pendingProductQuery);
  const matched = unisexProducts.find((product) => product.name === productName);
  if(!matched) return;
  document.getElementById("productSearch").value = matched.name;
  renderProducts();
  setTimeout(() => openModal(matched.name), 80);
}

function toggleModalDetails(){
  const modalDetails = document.getElementById("modalDetails");
  const modalMoreBtn = document.getElementById("modalMoreBtn");
  const isOpen = modalDetails.classList.toggle("is-open");
  modalMoreBtn.innerText = getModalDetailsButtonText(isOpen);
}

function closeModal(){
  document.getElementById("productModal").style.display = "none";
  document.getElementById("modalExtraImages").innerHTML = "";
  document.getElementById("modalStats").innerHTML = "";
  document.getElementById("modalDetails").classList.remove("is-open");
  document.getElementById("modalDetails").innerHTML = "";
  document.getElementById("modalMoreBtn").style.display = "none";
  currentProduct = null;
  unlockBodyScrollForModal();
}

function lockBodyScrollForModal(){
  if(document.body.classList.contains("modal-open")) return;
  modalScrollLockY = window.scrollY || window.pageYOffset || 0;
  document.body.classList.add("modal-open");
  document.body.style.top = `-${modalScrollLockY}px`;
}

function unlockBodyScrollForModal(){
  if(!document.body.classList.contains("modal-open")) return;
  document.body.classList.remove("modal-open");
  document.body.style.top = "";
  window.scrollTo(0, modalScrollLockY);
}

function changeModalQty(direction){
  modalQty = Math.max(1, modalQty + direction);
  document.getElementById("modalQty").innerText = modalQty;
}

function updateCartBadge(){
  document.getElementById("cartCountBadge").innerText = cart.reduce((sum, item) => sum + item.qty, 0);
}

function getCartOfferSummary(items){
  const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
  const freePieces = Math.floor(totalQty / 3);
  const freeByName = {};
  let discount = 0;
  if(!freePieces) return { freeByName, discount };
  const units = [];
  items.forEach((item) => {
    for(let i = 0; i < item.qty; i += 1) units.push({ name: item.name, price: item.price });
  });
  units.sort((a, b) => a.price - b.price).slice(0, freePieces).forEach((unit) => {
    freeByName[unit.name] = (freeByName[unit.name] || 0) + 1;
    discount += unit.price;
  });
  return { freeByName, discount };
}

function getItemSubtotal(item, offerSummary){
  const freeUnits = offerSummary.freeByName[item.name] || 0;
  return item.price * (item.qty - freeUnits);
}

function renderCart(){
  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");
  cartItems.innerHTML = "";
  const offerSummary = getCartOfferSummary(cart);
  let total = 0;
  cart.forEach((item, index) => {
    const subtotal = getItemSubtotal(item, offerSummary);
    total += subtotal;
    const row = document.createElement("div");
    row.className = "cart-item";
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    row.style.cursor = "pointer";
    row.title = currentLang === "ar" ? "افتح تفاصيل البرفان" : "Open perfume details";
    row.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <div class="cart-item-details">
        <h4>${item.name}</h4>
        <p>${item.price} EGP</p>
        <p>${t("qty")}: ${item.qty}</p>
        <p>${t("subtotal")}: ${subtotal} EGP</p>
        <button onclick="changeCartQty(${index}, -1)">-</button>
        <button onclick="changeCartQty(${index}, 1)">+</button>
      </div>
    `;
    row.addEventListener("click", (event) => {
      if (event.target.closest("button")) return;
      openCartProductFromItem(item);
    });
    row.addEventListener("keydown", (event) => {
      if (event.target.closest("button")) return;
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      openCartProductFromItem(item);
    });
    cartItems.appendChild(row);
  });
  cartTotal.innerText = offerSummary.discount
    ? t("total") + ": " + total + " EGP | " + t("discount") + ": " + offerSummary.discount + " EGP"
    : t("total") + ": " + total + " EGP";
  updateCartBadge();
  localStorage.setItem("ovaCart", JSON.stringify(cart));
}

function openCartProductFromItem(item){
  if(!item || !item.name) return;
  const cartElement = document.getElementById("cart");
  if(cartElement) cartElement.style.right = "-100%";
  if(typeof openModal === "function" && Array.isArray(window.unisexProducts) && window.unisexProducts.some((product) => product.name === item.name)){
    setTimeout(() => openModal(item.name), 120);
    return;
  }

  const catalog = window.ovaBrandCatalog || {};
  const brandKey = Object.keys(catalog).find((key) => ((catalog[key] || {}).products || []).some((product) => product.name === item.name));
  if(brandKey){
    location.href = "brand.html?brand=" + encodeURIComponent(brandKey) + "&product=" + encodeURIComponent(item.name);
    return;
  }

  location.href = "all-perfume.html?product=" + encodeURIComponent(item.name);
}

function flyToCart(imgElement){
  const cartIcon = document.getElementById("cartCountBadge")?.closest("button") || document.querySelector(".cart-trigger:last-of-type");
  if(!imgElement || !cartIcon) return;
  const a = imgElement.getBoundingClientRect();
  const b = cartIcon.getBoundingClientRect();
  const clone = imgElement.cloneNode(true);
  clone.className = "fly-img";
  clone.style.left = a.left + "px";
  clone.style.top = a.top + "px";
  document.body.appendChild(clone);
  clone.style.setProperty("--x", b.left + b.width / 2 - (a.left + a.width / 2) + "px");
  clone.style.setProperty("--y", b.top + b.height / 2 - (a.top + a.height / 2) + "px");
  clone.addEventListener("animationend", () => clone.remove());
  cartIcon.classList.add("cart-pulse");
  setTimeout(() => cartIcon.classList.remove("cart-pulse"), 700);
}

function revealTopCartBar(){
  const topBar = document.querySelector(".page-top");
  const cartButton = document.getElementById("cartCountBadge")?.closest("button") || document.querySelector(".cart-trigger:last-of-type");
  if(topBar){
    if(window.innerWidth <= 640){
      topBar.classList.add("is-cart-focus");
      clearTimeout(cartBarFocusTimer);
      cartBarFocusTimer = setTimeout(() => topBar.classList.remove("is-cart-focus"), 2400);
    }
    topBar.scrollIntoView({ behavior:"smooth", block:"start" });
  }
  if(cartButton){
    cartButton.classList.add("cart-pulse");
    setTimeout(() => cartButton.classList.remove("cart-pulse"), 700);
  }
}

function addToCart(name, qty = 1, imgElement = null){
  const product = unisexProducts.find((item) => item.name === name);
  if(!product) return;
  revealTopCartBar();
  if(imgElement) flyToCart(imgElement);
  const existing = cart.find((item) => item.name === product.name);
  if(existing) existing.qty += qty;
  else cart.push({ name: product.name, price: product.price, img: product.img, qty });
  renderCart();
}

function modalAddToCart(){
  if(!currentProduct) return;
  revealTopCartBar();
  addToCart(currentProduct.name, modalQty, document.getElementById("modalImg"));
  closeModal();
}

function changeCartQty(index, direction){
  cart[index].qty += direction;
  if(cart[index].qty <= 0) cart.splice(index, 1);
  renderCart();
}

function toggleCart(forceOpen = false){
  const cartSidebar = document.getElementById("cartSidebar");
  const shouldOpen = forceOpen || cartSidebar.style.right !== "0px";
  cartSidebar.style.right = shouldOpen ? "0px" : "-100%";
}

function goToCheckout(){
  localStorage.setItem("ovaCart", JSON.stringify(cart));
  window.location.href = "checkout.html";
}

function t(key){
  return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
}

function formatTypeLabel(typeValue){
  const translated = translations[currentLang]?.[typeValue];
  if(translated) return translated;

  return String(typeValue || "")
    .split(/[-_\s]+/)
    .filter(Boolean)
    .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
    .join(" ");
}

function populateTypeFilterOptions(){
  const typeFilter = document.getElementById("typeFilter");
  if(!typeFilter) return;

  const selectedValue = typeFilter.value || "all";
  const availableTypes = [...new Set(unisexProducts.flatMap((product) => product.filterTypes || []).filter(Boolean))]
    .sort((a, b) => {
      const aIndex = unisexTypeOrder.indexOf(a);
      const bIndex = unisexTypeOrder.indexOf(b);
      const safeA = aIndex === -1 ? unisexTypeOrder.length : aIndex;
      const safeB = bIndex === -1 ? unisexTypeOrder.length : bIndex;
      return safeA - safeB || a.localeCompare(b);
    });

  typeFilter.innerHTML = "";

  const allOption = document.createElement("option");
  allOption.value = "all";
  allOption.text = t("allTypes");
  typeFilter.appendChild(allOption);

  availableTypes.forEach((typeValue) => {
    const option = document.createElement("option");
    option.value = typeValue;
    option.text = formatTypeLabel(typeValue);
    typeFilter.appendChild(option);
  });

  typeFilter.value = selectedValue === "all" || availableTypes.includes(selectedValue) ? selectedValue : "all";
}

}
