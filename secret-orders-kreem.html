<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Panel</title>
  <meta name="description" content="Internal orders management panel for Ova Store." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://ovaperfume.com/secret-orders-kreem.html" />
  <style>
    button,
    input[type="button"],
    input[type="submit"],
    input[type="reset"],
    .back,
    .back-btn,
    .back-link,
    .cart-trigger,
    .dropdown-link-btn,
    .hero-btn,
    .install-app-btn,
    .modal-more-btn,
    .modal-add-btn,
    .modal-secondary-btn,
    .checkout-btn,
    .compare-secondary,
    .compare-primary,
    .close-search-btn,
    .filter-tab,
    .shop-all-btn,
    .copy-wallet-btn,
    .confirm-btn,
    .paypal-btn,
    .continue-shopping-btn,
    .submit-btn,
    .intro-enter-btn,
    .topbar-back,
    .topbar-cart {
      border-radius: 0 !important;
    }

    button,
    input[type="button"],
    input[type="submit"],
    input[type="reset"],
    .back,
    .back-btn,
    .back-link,
    .cart-trigger,
    .dropdown-link-btn,
    .hero-btn,
    .install-app-btn,
    .modal-more-btn,
    .modal-add-btn,
    .modal-secondary-btn,
    .checkout-btn,
    .compare-secondary,
    .compare-primary,
    .close-search-btn,
    .filter-tab,
    .shop-all-btn,
    .copy-wallet-btn,
    .confirm-btn,
    .paypal-btn,
    .continue-shopping-btn,
    .submit-btn,
    .intro-enter-btn,
    .topbar-back,
    .topbar-cart,
    .product-btn-label {
      background: #ffffff !important;
      background-image: none !important;
      border-color: rgba(0, 0, 0, 0.14) !important;
      color: #111111 !important;
      text-shadow: 0 0 6px rgba(214, 179, 122, 0.12), 0 0 1px rgba(214, 179, 122, 0.3);
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f6f3ee;color:#171412}
    .shell{width:min(1100px,calc(100% - 24px));margin:0 auto;padding:24px 0 40px}
    .card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 18px 36px rgba(0,0,0,.08);margin-bottom:18px}
    h1,h2,h3,p{margin:0}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .stat-box{background:#fffdfb;border:1px solid #ece4db;border-radius:18px;padding:16px}
    .stat-box small{display:block;color:#7c6d61;margin-bottom:8px}
    .stat-box strong{font-size:26px}
    .field{margin-bottom:14px}
    .field label{display:block;font-weight:700;margin-bottom:6px}
    .field input{width:100%;padding:14px 16px;border:1px solid #d7d0c8;border-radius:14px;font:inherit}
    button{border:none;background:#111;color:#fff;padding:12px 16px;border-radius:12px;font:inherit;cursor:pointer}
    button.secondary{background:#6d6258}
    button.danger{background:#b42318}
    button.success{background:#147d42}
    button.warning{background:#9c6b11}
    .hidden{display:none}
    .orders{display:grid;gap:16px}
    .order-card{border:1px solid #ece4db;border-radius:18px;padding:18px;background:#fffdfb}
    .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .label{font-size:12px;color:#7c6d61;text-transform:uppercase;letter-spacing:1px}
    .value{font-size:15px;margin-top:4px;word-break:break-word}
    .items{margin:14px 0 0;padding-left:18px}
    .empty{padding:24px;text-align:center;color:#6b5f56}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .status-chip{display:inline-flex;padding:8px 12px;border-radius:999px;background:#eee;font-weight:700}
    .status-pending{background:#f1efe9;color:#6b5f56}
    .status-delivered{background:#e1f4e8;color:#147d42}
    .status-cancelled{background:#fde8e8;color:#b42318}
    .note{font-size:13px;color:#7c6d61;margin-top:8px}
    @media (max-width:900px){.stats{grid-template-columns:1fr}}
    @media (max-width:700px){.meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <div id="loginBox" class="card">
      <h1 style="margin-bottom:16px">Orders Login</h1>
      <div class="field">
        <label for="ordersPassword">Password</label>
        <input id="ordersPassword" type="password" placeholder="Enter password">
      </div>
      <button id="loginBtn" type="button">Open Orders</button>
      <p id="loginMessage" style="margin-top:12px;color:#b42318"></p>
    </div>

    <div id="ordersPanel" class="hidden">
      <div class="card">
        <div class="top">
          <div>
            <h1>Orders Panel</h1>
            <p style="margin-top:6px;color:#6b5f56">All orders saved from this website appear here automatically.</p>
          </div>
          <div class="top">
            <button id="refreshBtn" type="button" class="secondary">Refresh</button>
            <button id="clearBtn" type="button" class="danger">Clear All</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="stats">
          <div class="stat-box">
            <small>Total Orders</small>
            <strong id="totalOrdersStat">0</strong>
          </div>
          <div class="stat-box">
            <small>Delivered Orders</small>
            <strong id="deliveredOrdersStat">0</strong>
          </div>
          <div class="stat-box">
            <small>Total Profit</small>
            <strong id="totalProfitStat">0 EGP</strong>
          </div>
        </div>
        <p class="note">Profit is calculated from orders marked as delivered only. Cancelled orders are excluded.</p>
      </div>

      <div id="ordersList" class="orders"></div>
    </div>
  </div>

  <script src="js/orders-store.js?v=20260419a"></script>
  <script>
    const PASSWORD = "kreem2222";
    const loginBox = document.getElementById("loginBox");
    const ordersPanel = document.getElementById("ordersPanel");
    const loginMessage = document.getElementById("loginMessage");
    const ordersList = document.getElementById("ordersList");
    const statusKey = "ovaOrdersStatus";
    const hiddenKey = "ovaOrdersHidden";
    const cleanupKey = "ovaOrdersCleanupApplied";

    function getStatusMap() {
      try {
        return JSON.parse(localStorage.getItem(statusKey) || "{}");
      } catch (error) {
        return {};
      }
    }

    function saveStatusMap(map) {
      localStorage.setItem(statusKey, JSON.stringify(map));
    }

    function getHiddenMap() {
      try {
        return JSON.parse(localStorage.getItem(hiddenKey) || "{}");
      } catch (error) {
        return {};
      }
    }

    function saveHiddenMap(map) {
      localStorage.setItem(hiddenKey, JSON.stringify(map));
    }

    function getOrderStatus(orderId) {
      const map = getStatusMap();
      return map[orderId] || "pending";
    }

    function setOrderStatus(orderId, status) {
      const map = getStatusMap();
      map[orderId] = status;
      saveStatusMap(map);
    }

    function applyInitialCleanup(orders) {
      if (localStorage.getItem(cleanupKey) === "true") {
        return orders;
      }

      if (orders.length > 1) {
        const hiddenMap = getHiddenMap();
        orders.slice(1).forEach((order) => {
          hiddenMap[order.id] = true;
        });
        saveHiddenMap(hiddenMap);
      }

      localStorage.setItem(cleanupKey, "true");
      return orders;
    }

    function updateStats(orders) {
      const visibleOrders = orders.filter((order) => !getHiddenMap()[order.id]);
      const deliveredOrders = visibleOrders.filter((order) => getOrderStatus(order.id) === "delivered");
      const totalProfit = deliveredOrders.reduce((sum, order) => sum + Number(order.totalPrice || 0), 0);

      document.getElementById("totalOrdersStat").textContent = String(visibleOrders.length);
      document.getElementById("deliveredOrdersStat").textContent = String(deliveredOrders.length);
      document.getElementById("totalProfitStat").textContent = `${totalProfit} EGP`;
    }

    function renderOrders(orders) {
      applyInitialCleanup(orders);
      const hiddenMap = getHiddenMap();
      const visibleOrders = orders.filter((order) => !hiddenMap[order.id]);
      ordersList.innerHTML = "";
      updateStats(orders);

      if (!visibleOrders.length) {
        ordersList.innerHTML = '<div class="card empty">No orders yet.</div>';
        return;
      }

      visibleOrders.forEach((order) => {
        const card = document.createElement("div");
        card.className = "order-card";
        const status = getOrderStatus(order.id);
        const statusClass =
          status === "delivered" ? "status-delivered" :
          status === "cancelled" ? "status-cancelled" :
          "status-pending";
        const itemsHtml = (order.items || [])
          .map((item) => `<li>${item.name} x ${item.quantity} - ${item.price} EGP</li>`)
          .join("");

        card.innerHTML = `
          <div class="top">
            <div>
              <h2>${order.id}</h2>
              <p style="margin-top:6px;color:#6b5f56">${new Date(order.createdAt).toLocaleString()}</p>
            </div>
            <div>
              <div style="font-weight:700">${order.totalPrice} EGP</div>
              <div class="status-chip ${statusClass}" style="margin-top:8px">${status}</div>
            </div>
          </div>
          <div class="meta">
            <div>
              <div class="label">Customer</div>
              <div class="value">${order.customerName || ""}</div>
            </div>
            <div>
              <div class="label">Phone</div>
              <div class="value">${order.phone || ""}</div>
            </div>
            <div>
              <div class="label">Email</div>
              <div class="value">${order.email || ""}</div>
            </div>
            <div>
              <div class="label">Payment Method</div>
              <div class="value">${order.paymentMethod || ""}</div>
            </div>
            <div>
              <div class="label">Address</div>
              <div class="value">${order.address || ""}</div>
            </div>
            <div>
              <div class="label">Notes</div>
              <div class="value">${order.notes || ""}</div>
            </div>
          </div>
          <h3 style="margin-top:16px">Items</h3>
          <ul class="items">${itemsHtml}</ul>
          <div class="actions">
            <button type="button" class="success" data-action="delivered" data-order-id="${order.id}">Delivered</button>
            <button type="button" class="warning" data-action="pending" data-order-id="${order.id}">Pending</button>
            <button type="button" class="danger" data-action="cancelled" data-order-id="${order.id}">Cancelled</button>
          </div>
        `;

        ordersList.appendChild(card);
      });

      ordersList.querySelectorAll("button[data-action]").forEach((button) => {
        button.addEventListener("click", function () {
          setOrderStatus(this.dataset.orderId, this.dataset.action);
          renderOrders(orders);
        });
      });
    }

    async function loadOrdersFromSource() {
      return window.ovaOrdersStore.getAll();
    }

    document.getElementById("loginBtn").addEventListener("click", async function () {
      const value = document.getElementById("ordersPassword").value;
      if (value !== PASSWORD) {
        loginMessage.textContent = "Wrong password.";
        return;
      }

      loginMessage.textContent = "";
      loginBox.classList.add("hidden");
      ordersPanel.classList.remove("hidden");
      renderOrders(await loadOrdersFromSource());
    });

    document.getElementById("refreshBtn").addEventListener("click", async function () {
      renderOrders(await loadOrdersFromSource());
    });

    document.getElementById("clearBtn").addEventListener("click", function () {
      if (!confirm("Delete all saved orders?")) return;
      window.ovaOrdersStore.clear();
      localStorage.removeItem(statusKey);
      localStorage.removeItem(hiddenKey);
      localStorage.removeItem(cleanupKey);
      renderOrders([]);
    });
  </script>
  <script src="js/ova-analytics.js?v=20260424b"></script>
</body>
</html>
