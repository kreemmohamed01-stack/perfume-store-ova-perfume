<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVA AI | Ova Perfume</title>
<meta name="description" content="Meet OVA AI - your personal fragrance assistant. Ask anything about perfumes in Arabic or English and get real recommendations." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0d0c0b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="images/site-assets/logooo-2.webp" />
<link rel="icon" type="image/jpeg" href="images/site-assets/logooo-2.webp" />
<link rel="shortcut icon" href="favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0c0b;
  --charcoal:#171513;
  --panel:#141311;
  --panel-2:#1b1917;
  --line:rgba(255,255,255,0.10);
  --line-soft:rgba(255,255,255,0.06);
  --ivory:#f8f5ef;
  --paper:#fcfbf8;
  --muted:rgba(248,245,239,0.58);
  --muted-2:rgba(248,245,239,0.4);
  --gold:#c9a66b;
  --gold-soft:#d5b77a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--ink);
  color:var(--ivory);
  font-family:"Inter",sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.ai-topbar{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px clamp(16px,4vw,40px);
  background:rgba(13,12,11,0.86);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line-soft);
}
.ai-topbar-left{display:flex;align-items:center;gap:14px}
.ai-back{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.03);
  color:var(--ivory);
  transition:background .25s ease, border-color .25s ease;
}
.ai-back:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.22)}
.ai-back svg{width:16px;height:16px}
.ai-brand{
  font-family:"Playfair Display",serif;
  font-size:19px;
  letter-spacing:0.02em;
}
.ai-brand em{font-style:italic;color:var(--gold)}
.ai-topbar-right{display:flex;align-items:center;gap:10px}
.ai-cart-link,.ai-account-link{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.03);
  position:relative;
}
.ai-cart-link svg,.ai-account-link svg{width:16px;height:16px}
.ai-cart-badge{
  position:absolute;top:-3px;right:-3px;
  min-width:15px;height:15px;padding:0 3px;
  border-radius:999px;
  background:var(--gold);
  color:#0d0c0b;
  font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--ink);
}

/* ---------- hero ---------- */
.ai-hero{
  position:relative;
  min-height:min(560px,86vh);
  display:flex;
  align-items:center;
  overflow:hidden;
  background:
    linear-gradient(100deg, rgba(13,12,11,0.94) 0%, rgba(13,12,11,0.72) 34%, rgba(13,12,11,0.18) 62%, rgba(13,12,11,0.55) 100%),
    url("images/ai-agent/hero.webp") center 32% / cover no-repeat;
}
.ai-hero-inner{
  position:relative;
  z-index:1;
  width:100%;
  max-width:1240px;
  margin:0 auto;
  padding:64px clamp(20px,5vw,44px) 56px;
}
.ai-hero-kicker{
  display:block;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.32em;
  text-transform:uppercase;
  color:var(--gold-soft);
  margin-bottom:18px;
}
.ai-hero-title{
  font-family:"Playfair Display",serif;
  font-weight:600;
  font-size:clamp(46px,9vw,92px);
  line-height:0.98;
  letter-spacing:-0.01em;
  max-width:640px;
}
.ai-hero-title .ai-hero-title-line{display:block}
.ai-hero-title em{
  font-style:italic;
  color:var(--gold);
  display:block;
}
.ai-hero-sub{
  margin-top:22px;
  font-size:15px;
  line-height:1.8;
  color:var(--muted);
  max-width:380px;
}
.ai-hero-cta{
  margin-top:32px;
  display:inline-flex;
  align-items:center;
  gap:12px;
  padding:16px 30px;
  border-radius:999px;
  background:var(--ivory);
  color:var(--ink);
  font-size:12px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  border:1px solid var(--ivory);
  transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease, background .35s ease;
}
.ai-hero-cta:hover{
  transform:translateY(-3px);
  box-shadow:0 22px 44px rgba(0,0,0,0.4);
}
.ai-hero-cta svg{width:14px;height:14px;transition:transform .35s ease}
.ai-hero-cta:hover svg{transform:translateX(4px)}
html[dir="rtl"] .ai-hero-cta:hover svg{transform:translateX(-4px) scaleX(-1)}
html[dir="rtl"] .ai-hero-cta svg{transform:scaleX(-1)}

/* ---------- category tiles ---------- */
.ai-tiles{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:1px;
  background:var(--line-soft);
}
.ai-tile{
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  background:var(--panel);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:20px;
  isolation:isolate;
}
.ai-tile img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  transition:transform .8s cubic-bezier(.22,1,.36,1);
}
.ai-tile::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(180deg, rgba(13,12,11,0.05) 0%, rgba(13,12,11,0.75) 100%);
}
.ai-tile:hover img{transform:scale(1.08)}
.ai-tile-icon{
  width:30px;height:30px;
  margin-bottom:auto;
  display:flex;align-items:center;justify-content:center;
  color:var(--ivory);
}
.ai-tile-icon svg{width:20px;height:20px}
.ai-tile-name{
  font-family:"Playfair Display",serif;
  font-size:19px;
  font-weight:600;
  line-height:1.2;
  color:var(--ivory);
}
.ai-tile-arrow{
  margin-top:10px;
  display:flex;align-items:center;
  color:var(--gold-soft);
  transition:transform .35s var(--ease,cubic-bezier(.22,1,.36,1));
}
.ai-tile-arrow svg{width:15px;height:15px}
.ai-tile:hover .ai-tile-arrow{transform:translateX(5px)}
html[dir="rtl"] .ai-tile-arrow svg{transform:scaleX(-1)}
html[dir="rtl"] .ai-tile:hover .ai-tile-arrow{transform:translateX(-5px)}

/* ---------- chat shell ---------- */
.ai-chat-shell{
  max-width:820px;
  margin:0 auto;
  padding:40px clamp(16px,4vw,24px) 140px;
}
.ai-quick-label{
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--muted-2);
  margin:0 0 12px 4px;
}
.ai-quick-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:32px;
}
.ai-quick-chip{
  padding:10px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.03);
  color:var(--ivory);
  font-size:12.5px;
  font-weight:500;
  transition:border-color .25s ease, background .25s ease, transform .25s ease;
}
.ai-quick-chip:hover{
  border-color:rgba(201,166,107,0.5);
  background:rgba(201,166,107,0.08);
  transform:translateY(-1px);
}

.ai-thread{
  display:flex;
  flex-direction:column;
  gap:22px;
}
.ai-row{display:flex;gap:12px;align-items:flex-start}
.ai-row.user{flex-direction:row-reverse}
.ai-avatar{
  flex:0 0 auto;
  width:32px;height:32px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#2a2a2a,#0d0c0b);
  border:1px solid var(--line);
}
.ai-avatar svg{width:15px;height:15px}
.ai-avatar.user{
  background:var(--ivory);
  color:var(--ink);
}
.ai-avatar.user svg{width:14px;height:14px}
.ai-bubble-col{display:flex;flex-direction:column;gap:10px;max-width:78%}
.ai-row.user .ai-bubble-col{align-items:flex-end}
.ai-bubble{
  padding:14px 18px;
  border-radius:20px;
  font-size:14.5px;
  line-height:1.75;
  white-space:pre-wrap;
}
.ai-row.bot .ai-bubble{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-top-left-radius:6px;
  color:var(--ivory);
}
html[dir="rtl"] .ai-row.bot .ai-bubble{border-top-left-radius:20px;border-top-right-radius:6px}
.ai-row.user .ai-bubble{
  background:var(--ivory);
  color:var(--ink);
  border-top-right-radius:6px;
  font-weight:500;
}
html[dir="rtl"] .ai-row.user .ai-bubble{border-top-right-radius:20px;border-top-left-radius:6px}

.ai-cursor{
  display:inline-block;
  width:2px;height:14px;
  background:var(--gold-soft);
  margin-inline-start:2px;
  vertical-align:-2px;
  animation:aiCursorBlink 0.9s steps(1) infinite;
}
@keyframes aiCursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

.ai-typing{
  display:inline-flex;
  gap:4px;
  padding:6px 2px;
}
.ai-typing span{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--muted);
  animation:aiTypingBounce 1.1s ease-in-out infinite;
}
.ai-typing span:nth-child(2){animation-delay:.15s}
.ai-typing span:nth-child(3){animation-delay:.3s}
@keyframes aiTypingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.ai-suggest-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.ai-suggest-btn{
  padding:9px 14px;
  border-radius:999px;
  border:1px solid rgba(201,166,107,0.35);
  background:rgba(201,166,107,0.08);
  color:var(--gold-soft);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:0.02em;
  transition:background .25s ease, transform .25s ease;
}
.ai-suggest-btn:hover{background:rgba(201,166,107,0.16);transform:translateY(-1px)}

.ai-product-card{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px;
  border-radius:16px;
  border:1px solid var(--line-soft);
  background:var(--panel-2);
  width:100%;
  text-align:left;
}
html[dir="rtl"] .ai-product-card{text-align:right}
.ai-product-card img{
  width:52px;height:52px;
  object-fit:contain;
  background:#fff;
  border-radius:10px;
  flex:0 0 auto;
  padding:4px;
}
.ai-product-card-info{flex:1;min-width:0}
.ai-product-card-name{
  font-size:13px;
  font-weight:600;
  color:var(--ivory);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ai-product-card-price{
  font-size:12px;
  color:var(--gold-soft);
  margin-top:2px;
}
.ai-product-card-arrow{
  flex:0 0 auto;
  color:var(--muted);
  width:14px;height:14px;
}
html[dir="rtl"] .ai-product-card-arrow{transform:scaleX(-1)}

/* ---------- composer ---------- */
.ai-composer-wrap{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:30;
  padding:16px clamp(16px,4vw,24px) calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(13,12,11,0) 0%, rgba(13,12,11,0.92) 30%, var(--ink) 62%);
}
.ai-composer{
  max-width:820px;
  margin:0 auto;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:8px 8px 8px 20px;
  border-radius:26px;
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}
.ai-composer-input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  resize:none;
  color:var(--ivory);
  font-family:inherit;
  font-size:14.5px;
  line-height:1.6;
  max-height:120px;
  padding:10px 0;
}
.ai-composer-input::placeholder{color:var(--muted-2)}
.ai-send-btn{
  flex:0 0 auto;
  width:42px;height:42px;
  border-radius:50%;
  border:none;
  background:var(--ivory);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s cubic-bezier(.22,1,.36,1), background .25s ease, opacity .25s ease;
}
.ai-send-btn svg{width:16px;height:16px}
html[dir="rtl"] .ai-send-btn svg{transform:scaleX(-1)}
.ai-send-btn:hover{transform:scale(1.06)}
.ai-send-btn:disabled{opacity:0.35;transform:none;cursor:default}
.ai-composer-note{
  max-width:820px;
  margin:10px auto 0;
  text-align:center;
  font-size:10.5px;
  color:var(--muted-2);
  letter-spacing:0.02em;
}

/* scrollbar */
.ai-chat-shell::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:999px}

@media (max-width:900px){
  .ai-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .ai-hero{min-height:420px}
  .ai-hero-inner{padding:44px 18px 40px}
  .ai-hero-sub{max-width:none}
  .ai-bubble-col{max-width:86%}
  .ai-topbar{padding:14px 16px}
}

@media (prefers-reduced-motion: reduce){
  .ai-tile img,.ai-tile-arrow,.ai-hero-cta,.ai-send-btn{transition:none !important}
  .ai-typing span,.ai-cursor{animation:none !important}
}
</style>
</head>

<script>
(function(){
  const isAr = () => localStorage.getItem("ovaLang") === "ar";

  const TXT = {
    en: {
      kicker: "MEET", em: "AI", sub: "Discover. Ask. Find. Your perfect scent, made personal.",
      start: "Start Chatting", tryLabel: "TRY ASKING",
      quick: ["Best men's perfumes?", "Long lasting scents", "Gifts under 1000 EGP", "Something sweet for winter"],
      placeholder: "Ask OVA AI anything...",
      note: "A smarter way to experience fragrance — explore, discover, belong.",
      tileScent: "Find My<br>Scent", tileNotes: "Explore<br>Notes", tileGift: "Gift<br>Suggestions", tileLearn: "Learn About<br>Perfumes",
      openProduct: "View", morning: "Good morning", evening: "Good evening", afternoon: "Good afternoon", night: "Good evening",
      greeting: name => `${name} \u{1F44B} I'm OVA AI, your personal fragrance assistant. How can I help you today?`
    },
    ar: {
      kicker: "تعرف على", em: "الذكاء الاصطناعي", sub: "اكتشف. اسأل. لاقي عطرك اللي يناسبك بالظبط.",
      start: "ابدأ المحادثة", tryLabel: "جرب تسأل",
      quick: ["أفضل برفانات رجالي؟", "برفانات ثباتها عالي", "هدايا تحت 1000 جنيه", "حاجة سويت للشتا"],
      placeholder: "اسأل OVA AI أي حاجة...",
      note: "طريقة أذكى تعيش بيها تجربة العطور — اكتشف، جرب، وكن جزء منها.",
      tileScent: "لاقي<br>عطرك", tileNotes: "استكشف<br>النوتات", tileGift: "اقتراحات<br>هدايا", tileLearn: "تعلم عن<br>البرفانات",
      openProduct: "افتح", morning: "صباح الخير", evening: "مساء الخير", afternoon: "مساء الخير", night: "مساء الخير",
      greeting: name => `${name} \u{1F60A} أنا OVA AI، مساعدك الشخصي للعطور. أقدر أساعدك ازاي النهاردة؟`
    }
  };

  function timeOfDayKey(){
    const h = new Date().getHours();
    if (h < 5) return "night";
    if (h < 12) return "morning";
    if (h < 18) return "afternoon";
    return "evening";
  }

  function applyStaticText(){
    const ar = isAr();
    const t = TXT[ar ? "ar" : "en"];
    document.documentElement.dir = ar ? "rtl" : "ltr";
    document.getElementById("aiHeroKicker").textContent = t.kicker;
    document.getElementById("aiHeroEm").textContent = t.em;
    document.getElementById("aiHeroSub").textContent = t.sub;
    document.getElementById("aiStartChattingLabel").textContent = t.start;
    document.getElementById("aiTryLabel").textContent = t.tryLabel;
    document.getElementById("aiInput").placeholder = t.placeholder;
    document.getElementById("aiComposerNote").textContent = t.note;
    document.querySelectorAll(".ai-tile [data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (t[key]) el.innerHTML = t[key];
    });

    const quickRow = document.getElementById("aiQuickRow");
    quickRow.innerHTML = "";
    t.quick.forEach((label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ai-quick-chip";
      b.textContent = label;
      b.onclick = () => sendMessage(label);
      quickRow.appendChild(b);
    });
  }

  function updateCartBadge(){
    try {
      const cart = JSON.parse(localStorage.getItem("ovaCart") || "[]");
      const count = cart.reduce((s, i) => s + (i.qty || 1), 0);
      const badge = document.getElementById("aiCartBadge");
      if (count > 0) { badge.hidden = false; badge.textContent = count; }
      else badge.hidden = true;
    } catch (e) {}
  }

  const thread = document.getElementById("aiThread");
  const input = document.getElementById("aiInput");
  const sendBtn = document.getElementById("aiSendBtn");

  function scrollToBottom(){
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function botAvatarSvg(){
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5c-.9 3-1.3 4.9-3.3 6.9-2 2-3.9 2.4-6.9 3.3 3 .9 4.9 1.3 6.9 3.3 2 2 2.4 3.9 3.3 6.9.9-3 1.3-4.9 3.3-6.9 2-2 3.9-2.4 6.9-3.3-3-.9-4.9-1.3-6.9-3.3-2-2-2.4-3.9-3.3-6.9z" fill="#c9a66b"/></svg>';
  }
  function userAvatarSvg(){
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zM4 20c0-3.5 3.5-6 8-6s8 2.5 8 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  }

  function addUserRow(text){
    const row = document.createElement("div");
    row.className = "ai-row user";
    row.innerHTML = `<div class="ai-avatar user">${userAvatarSvg()}</div><div class="ai-bubble-col"><div class="ai-bubble"></div></div>`;
    row.querySelector(".ai-bubble").textContent = text;
    thread.appendChild(row);
    scrollToBottom();
  }

  function addTypingRow(){
    const row = document.createElement("div");
    row.className = "ai-row bot";
    row.innerHTML = `<div class="ai-avatar">${botAvatarSvg()}</div><div class="ai-bubble-col"><div class="ai-bubble"><span class="ai-typing"><span></span><span></span><span></span></span></div></div>`;
    thread.appendChild(row);
    scrollToBottom();
    return row;
  }

  // Streams text into a bubble one character at a time, ChatGPT-style,
  // with a blinking cursor while it types.
  function streamInto(bubbleEl, text, onDone){
    bubbleEl.innerHTML = "";
    const cursor = document.createElement("span");
    cursor.className = "ai-cursor";
    let i = 0;
    const speed = 14; // ms per character - fast enough to feel real, slow enough to read as typed
    function step(){
      if (i <= text.length) {
        bubbleEl.textContent = text.slice(0, i);
        bubbleEl.appendChild(cursor);
        i++;
        scrollToBottom();
        setTimeout(step, speed);
      } else {
        cursor.remove();
        if (onDone) onDone();
      }
    }
    step();
  }

  function buildProductCard(product){
    const brain = window.OvaAssistantBrain;
    const card = document.createElement("button");
    card.type = "button";
    card.className = "ai-product-card";
    const img = document.createElement("img");
    img.src = product.img;
    img.alt = product.name;
    img.loading = "lazy";
    const info = document.createElement("div");
    info.className = "ai-product-card-info";
    const name = document.createElement("div");
    name.className = "ai-product-card-name";
    name.textContent = product.name;
    const price = document.createElement("div");
    price.className = "ai-product-card-price";
    price.textContent = (product.price || "") + (isAr() ? " ج.م" : " EGP");
    info.append(name, price);
    const arrow = document.createElement("span");
    arrow.className = "ai-product-card-arrow";
    arrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    card.append(img, info, arrow);
    card.onclick = () => { if (brain && brain.go) brain.go(product); };
    return card;
  }

  function addBotResult(row, result){
    const col = row.querySelector(".ai-bubble-col");
    const bubble = col.querySelector(".ai-bubble");
    streamInto(bubble, result.text, () => {
      if (result.actions && result.actions.length) {
        const wrap = document.createElement("div");
        wrap.className = "ai-suggest-row";
        result.actions.forEach((action) => {
          if (action.product) {
            wrap.appendChild(buildProductCard(action.product));
          } else {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "ai-suggest-btn";
            b.textContent = action.label;
            b.onclick = () => sendMessage(action.label);
            wrap.appendChild(b);
          }
        });
        col.appendChild(wrap);
        scrollToBottom();
      }
    });
  }

  let productsIndex = null;
  function getBrainReply(text){
    const brain = window.OvaAssistantBrain;
    if (!brain) {
      return { text: isAr() ? "المساعد بيتحمل، جرب تاني بعد لحظة." : "The assistant is still loading, try again in a moment.", actions: [] };
    }
    if (!productsIndex) productsIndex = brain.collect();
    return brain.reply(text, productsIndex);
  }

  function sendMessage(text){
    const value = String(text || input.value || "").trim();
    if (!value) return;
    addUserRow(value);
    input.value = "";
    autoGrow();
    updateSendState();

    const typingRow = addTypingRow();
    const delay = 420 + Math.random() * 380; // feels like real "thinking" time
    setTimeout(() => {
      const result = getBrainReply(value);
      typingRow.querySelector(".ai-typing").remove();
      addBotResult(typingRow, result);
    }, delay);
  }

  function autoGrow(){
    input.style.height = "auto";
    input.style.height = Math.min(120, input.scrollHeight) + "px";
  }
  function updateSendState(){
    sendBtn.disabled = !input.value.trim();
  }

  input.addEventListener("input", () => { autoGrow(); updateSendState(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener("click", () => sendMessage());

  document.getElementById("aiStartChatting").addEventListener("click", () => {
    input.focus();
    window.scrollTo({ top: document.querySelector(".ai-chat-shell").offsetTop - 90, behavior: "smooth" });
  });

  document.querySelectorAll(".ai-tile").forEach((tile) => {
    tile.addEventListener("click", () => {
      const prompt = isAr() ? tile.getAttribute("data-prompt-ar") : tile.getAttribute("data-prompt-en");
      sendMessage(prompt);
      window.scrollTo({ top: document.querySelector(".ai-chat-shell").offsetTop - 90, behavior: "smooth" });
    });
  });

  function greet(){
    const ar = isAr();
    const t = TXT[ar ? "ar" : "en"];
    const timeLabel = t[timeOfDayKey()];
    const row = addTypingRow();
    setTimeout(() => {
      row.querySelector(".ai-typing").remove();
      addBotResult(row, { text: t.greeting(timeLabel), actions: [] });
    }, 500);
  }

  function boot(){
    applyStaticText();
    updateCartBadge();
    greet();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("storage", updateCartBadge);
})();
</script>
</body>
</html>
