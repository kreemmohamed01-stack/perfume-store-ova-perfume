<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OVA AI | Ova Perfume</title>
<meta name="description" content="Meet OVA AI - your personal fragrance assistant. Ask anything about perfumes in Arabic or English and get real recommendations." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#f4f1ea" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="images/site-assets/logooo-2.webp" />
<link rel="icon" type="image/jpeg" href="images/site-assets/logooo-2.webp" />
<link rel="shortcut icon" href="favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f4f1ea;
  --card:#ffffff;
  --ink:#141210;
  --ink-2:#3a352f;
  --muted:#7d7469;
  --line:rgba(20,18,16,0.10);
  --gold:#b08d57;
  --dark:#111010;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--page)}
body{
  background:var(--page);
  color:var(--ink);
  font-family:"Inter",sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}

.ai-wrap{max-width:900px;margin:0 auto}

/* ---------- hero ---------- */
.ai-hero{
  position:relative;
  margin:0 0 6px;
  min-height:520px;
  display:flex;align-items:center;
  overflow:hidden;
  background:url("images/ai-agent/hero.webp") center/cover no-repeat;
}
.ai-hero::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(95deg, rgba(18,15,13,0.90) 0%, rgba(18,15,13,0.66) 38%, rgba(18,15,13,0.12) 66%, rgba(18,15,13,0.30) 100%);
}
.ai-hero-in{position:relative;z-index:1;padding:44px 24px 46px;color:#fff;width:100%}
.ai-hero-kicker{
  font-size:12px;font-weight:400;
  letter-spacing:0.42em;text-transform:uppercase;
  color:rgba(255,255,255,0.88);
}
.ai-hero-title{
  margin-top:10px;
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:clamp(52px,14vw,74px);
  line-height:1;
  letter-spacing:0.01em;
}
.ai-hero-role{
  margin-top:16px;
  font-size:12.5px;font-weight:400;
  letter-spacing:0.30em;text-transform:uppercase;
  line-height:1.9;
  color:rgba(255,255,255,0.92);
}
.ai-hero-rule{width:54px;height:1px;background:rgba(255,255,255,0.5);margin:20px 0}
.ai-hero-sub{
  font-size:16px;line-height:1.65;
  color:rgba(255,255,255,0.95);
  font-weight:300;
}
.ai-hero-cta{
  margin-top:26px;
  display:inline-flex;align-items:center;gap:26px;
  padding:15px 26px;
  border:1px solid rgba(255,255,255,0.55);
  border-radius:999px;
  color:#fff;
  font-size:12px;font-weight:500;
  letter-spacing:0.22em;text-transform:uppercase;
  transition:background .3s ease,border-color .3s ease;
}
.ai-hero-cta:hover{background:rgba(255,255,255,0.12);border-color:#fff}
.ai-hero-cta svg{width:17px;height:17px}
html[dir="rtl"] .ai-hero-cta svg{transform:scaleX(-1)}
.ai-hero-tag{
  position:absolute;right:24px;bottom:44px;z-index:1;
  text-align:right;
  font-family:"Playfair Display",serif;
  font-size:13px;line-height:1.7;
  letter-spacing:0.16em;
  color:rgba(255,255,255,0.82);
  text-transform:uppercase;
}
html[dir="rtl"] .ai-hero-tag{right:auto;left:24px;text-align:left}

/* ---------- tiles ---------- */
.ai-tiles{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:14px 20px 4px;
}
.ai-tile{
  position:relative;
  aspect-ratio:37/60;
  border-radius:16px;
  overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px 13px 15px;
  text-align:left;
  isolation:isolate;
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
html[dir="rtl"] .ai-tile{text-align:right}
.ai-tile:hover{transform:translateY(-4px)}
.ai-tile::before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  border-radius:inherit;
  box-shadow:0 0 0 1px rgba(255,255,255,0.14) inset;
  opacity:0;
  transition:opacity .35s ease;
}
.ai-tile:hover::before{opacity:1;box-shadow:0 0 0 1px rgba(255,255,255,0.3) inset,0 0 18px rgba(155,114,242,.35)}
.ai-tile img{
  position:absolute;inset:0;z-index:-2;
  width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.22,1,.36,1);
}
.ai-tile:hover img{transform:scale(1.07)}
.ai-tile::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0.42) 72%,rgba(0,0,0,0.62) 100%);
}
.ai-tile.light::after{
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.45) 60%,rgba(255,255,255,0.72) 100%);
}
.ai-tile-ico{
  position:absolute;top:14px;left:13px;z-index:1;
  width:22px;height:22px;color:#fff;
}
html[dir="rtl"] .ai-tile-ico{left:auto;right:13px}
.ai-tile.light .ai-tile-ico{color:var(--ink)}
.ai-tile-ico svg{width:100%;height:100%}
.ai-tile-name{
  font-family:"Playfair Display",serif;
  font-weight:500;
  font-size:17px;line-height:1.18;
  color:#fff;
}
.ai-tile.light .ai-tile-name{color:var(--ink)}
.ai-tile-arw{margin-top:9px;color:#fff;display:flex}
.ai-tile.light .ai-tile-arw{color:var(--ink)}
.ai-tile-arw svg{width:20px;height:20px}
html[dir="rtl"] .ai-tile-arw svg{transform:scaleX(-1)}

/* ---------- composer ---------- */
.ai-composer-block{
  position:sticky;
  bottom:0;
  z-index:40;
  padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(244,241,234,0) 0%,rgba(244,241,234,0.94) 26%,var(--page) 58%);
}
.ai-composer{
  position:relative;
  display:flex;align-items:center;gap:10px;
  padding:9px 9px 9px 20px;
  background:#0c0b0a;
  border-radius:999px;
  box-shadow:0 4px 22px rgba(0,0,0,0.28),0 0 0 1px rgba(255,255,255,0.06) inset;
  overflow:hidden;
  isolation:isolate;
}
html[dir="rtl"] .ai-composer{padding:9px 20px 9px 9px}
.ai-composer::before{
  content:"";position:absolute;inset:-40%;z-index:-1;
  background:conic-gradient(from 0deg,transparent 0%,rgba(155,114,242,.5) 12%,transparent 24%,transparent 55%,rgba(66,133,244,.45) 67%,transparent 79%);
  animation:ovaComposerSpin 7s linear infinite;
  opacity:.55;
}
.ai-composer.is-focused{box-shadow:0 6px 28px rgba(0,0,0,0.34),0 0 0 1px rgba(255,255,255,.12) inset,0 0 22px rgba(155,114,242,.35)}
@keyframes ovaComposerSpin{to{transform:rotate(360deg)}}
.ai-spark{width:34px;height:34px;flex:0 0 auto;display:flex}
.ai-spark img{width:100%;height:100%;object-fit:contain;display:block}
.ai-input{
  flex:1;min-width:0;
  border:none;outline:none;background:none;resize:none;
  font-family:inherit;font-size:15.5px;line-height:1.5;
  color:#fff;
  max-height:110px;
  padding:8px 0;
}
.ai-input::placeholder{color:rgba(255,255,255,0.42)}
.ai-send{
  flex:0 0 auto;
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,#4285f4,#9b72f2 45%,#d96570 75%,#f2a600);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s cubic-bezier(.22,1,.36,1),opacity .25s ease,box-shadow .25s ease;
  box-shadow:0 0 14px rgba(155,114,242,.5);
}
.ai-send svg{width:19px;height:19px}
html[dir="rtl"] .ai-send svg{transform:scaleX(-1)}
.ai-send:hover{transform:scale(1.08);box-shadow:0 0 22px rgba(155,114,242,.75)}
.ai-send:disabled{opacity:.34;transform:none;cursor:default;box-shadow:none}

/* ---------- try asking ---------- */
.ai-try{padding:24px 20px 0}
.ai-try-label{
  font-size:11px;font-weight:500;
  letter-spacing:0.26em;text-transform:uppercase;
  color:var(--muted);
  margin-bottom:13px;
}
.ai-chips{display:flex;gap:11px;flex-wrap:wrap}
.ai-chip{
  padding:13px 21px;
  border-radius:999px;
  background:#e7e3da;
  color:var(--ink-2);
  font-size:14.5px;font-weight:400;
  transition:background .25s ease,transform .25s ease;
}
.ai-chip:hover{background:#ddd8cd;transform:translateY(-1px);box-shadow:0 0 14px rgba(155,114,242,.22)}

/* ---------- thread ---------- */
.ai-thread{padding:6px 20px 0;display:flex;flex-direction:column;gap:18px}
.ai-thread:not(:empty){padding-top:26px}
.ai-row{display:flex;gap:10px;align-items:flex-start}
.ai-row.user{flex-direction:row-reverse}
.ai-av{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#0c0b0a;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
}
.ai-av svg{width:16px;height:16px}
.ai-av.bot{background:none;box-shadow:none}
.ai-av img{width:38px;height:38px;object-fit:contain}
.ai-av.user{background:#e7e3da;color:var(--ink);box-shadow:none}
.ai-av.user svg{filter:none;animation:none}
.ai-col{display:flex;flex-direction:column;gap:9px;max-width:80%}
.ai-row.user .ai-col{align-items:flex-end}
.ai-bub{
  padding:13px 17px;border-radius:18px;
  font-size:15px;line-height:1.72;
  white-space:pre-wrap;
}
.ai-row.bot .ai-bub{background:var(--card);border-top-left-radius:5px;box-shadow:0 2px 10px rgba(20,18,16,0.04)}
html[dir="rtl"] .ai-row.bot .ai-bub{border-top-left-radius:18px;border-top-right-radius:5px}
.ai-row.user .ai-bub{background:var(--dark);color:#fff;border-top-right-radius:5px}
html[dir="rtl"] .ai-row.user .ai-bub{border-top-right-radius:18px;border-top-left-radius:5px}

.ai-cursor{
  display:inline-block;width:2px;height:15px;
  background:var(--gold);margin-inline-start:2px;vertical-align:-3px;
  animation:blink .9s steps(1) infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ovaRowIn{0%{opacity:0;transform:scale(.92) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.ai-row{animation:ovaRowIn .4s cubic-bezier(.22,1,.36,1) both}
@keyframes ovaTileIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.ai-tile{animation:ovaTileIn .5s cubic-bezier(.22,1,.36,1) both}
.ai-tile:nth-child(2){animation-delay:.06s}
.ai-tile:nth-child(3){animation-delay:.12s}
.ai-tile:nth-child(4){animation-delay:.18s}

/* ---------- slow entrance after the intro video ---------- */
/* Only plays right after the full-screen agent intro, not on ordinary
   navigation/reload - gated by the ova-entrance-pending class the inline
   head script adds to <html> before first paint (avoids a flash) when it
   finds the one-shot marker the intro sets. Each block waits its turn
   instead of appearing all at once, so the page settles in deliberately
   rather than popping into view. */
@keyframes ovaEntranceRise{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:translateY(0)}}
html.ova-entrance-pending body .ai-hero-kicker,
html.ova-entrance-pending body .ai-hero-title,
html.ova-entrance-pending body .ai-hero-role,
html.ova-entrance-pending body .ai-hero-rule,
html.ova-entrance-pending body .ai-hero-sub,
html.ova-entrance-pending body .ai-hero-cta,
html.ova-entrance-pending body .ai-hero-tag,
html.ova-entrance-pending body .ai-tiles,
html.ova-entrance-pending body .ai-try,
html.ova-entrance-pending body .ai-banner,
html.ova-entrance-pending body .ai-composer-block{
  opacity:0;
  animation:ovaEntranceRise 1.1s cubic-bezier(.16,1,.3,1) both;
}
html.ova-entrance-pending body .ai-hero-kicker{animation-delay:.15s}
html.ova-entrance-pending body .ai-hero-title{animation-delay:.32s}
html.ova-entrance-pending body .ai-hero-role{animation-delay:.5s}
html.ova-entrance-pending body .ai-hero-rule{animation-delay:.66s}
html.ova-entrance-pending body .ai-hero-sub{animation-delay:.78s}
html.ova-entrance-pending body .ai-hero-cta{animation-delay:.95s}
html.ova-entrance-pending body .ai-hero-tag{animation-delay:1.1s}
html.ova-entrance-pending body .ai-tiles{animation-delay:1.3s}
html.ova-entrance-pending body .ai-tiles .ai-tile{animation:none;opacity:1}
html.ova-entrance-pending body .ai-try{animation-delay:1.55s}
html.ova-entrance-pending body .ai-banner{animation-delay:1.75s}
html.ova-entrance-pending body .ai-composer-block{animation-delay:1.95s}
@media (prefers-reduced-motion:reduce){
  html.ova-entrance-pending body .ai-hero-kicker,
  html.ova-entrance-pending body .ai-hero-title,
  html.ova-entrance-pending body .ai-hero-role,
  html.ova-entrance-pending body .ai-hero-rule,
  html.ova-entrance-pending body .ai-hero-sub,
  html.ova-entrance-pending body .ai-hero-cta,
  html.ova-entrance-pending body .ai-hero-tag,
  html.ova-entrance-pending body .ai-tiles,
  html.ova-entrance-pending body .ai-try,
  html.ova-entrance-pending body .ai-banner,
  html.ova-entrance-pending body .ai-composer-block{
    animation:none!important;opacity:1;
  }
}
.ai-typing{display:inline-flex;gap:4px;padding:5px 2px}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:#b8b0a4;animation:bob 1.1s ease-in-out infinite}
.ai-typing span:nth-child(2){animation-delay:.15s}
.ai-typing span:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

.ai-prod{
  display:flex;align-items:center;gap:11px;
  padding:10px;border-radius:14px;
  background:var(--card);
  box-shadow:0 2px 10px rgba(20,18,16,0.05);
  width:100%;text-align:left;
}
html[dir="rtl"] .ai-prod{text-align:right}
.ai-prod img{width:48px;height:48px;object-fit:contain;border-radius:9px;background:#fff;flex:0 0 auto}
.ai-prod-i{flex:1;min-width:0}
.ai-prod-n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-prod-p{font-size:12.5px;color:var(--gold);margin-top:2px}
.ai-prod svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
html[dir="rtl"] .ai-prod svg{transform:scaleX(-1)}

/* ---------- banner ---------- */
.ai-banner{
  position:relative;
  margin:30px 20px 0;
  border-radius:18px;
  overflow:hidden;
  min-height:190px;
  display:flex;align-items:center;
  background:#100f0e url("images/ai-agent/banner-smoke.webp") right center/cover no-repeat;
}
.ai-banner::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(12,11,10,0.95) 0%,rgba(12,11,10,0.72) 46%,rgba(12,11,10,0.15) 100%);
}
.ai-banner-in{position:relative;z-index:1;padding:26px 22px;color:#fff;flex:1}
.ai-banner-t{
  font-family:"Playfair Display",serif;
  font-weight:400;font-size:23px;line-height:1.35;
}
.ai-banner-rule{width:44px;height:1px;background:rgba(255,255,255,0.45);margin:16px 0 14px}
.ai-banner-s{
  font-size:9.5px;letter-spacing:0.26em;text-transform:uppercase;
  color:rgba(255,255,255,0.75);
}
.ai-banner-side{
  position:absolute;right:22px;top:50%;transform:translateY(-50%);z-index:1;
  text-align:right;
  font-size:10px;letter-spacing:0.26em;line-height:2.3;
  text-transform:uppercase;color:rgba(255,255,255,0.88);
}
html[dir="rtl"] .ai-banner-side{right:auto;left:22px;text-align:left}


@media (min-width:760px){
  .ai-hero-in{padding:60px 40px}
  .ai-tiles{padding:18px 40px 4px;gap:14px}
  .ai-try,.ai-thread{padding-left:40px;padding-right:40px}
  .ai-composer-block{padding-left:40px;padding-right:40px}
  .ai-banner{margin-left:40px;margin-right:40px}
}
@media (max-width:420px){
  .ai-tiles{grid-template-columns:repeat(2,1fr)}
  .ai-hero-tag{display:none}
  .ai-banner-side{display:none}
}
@media (prefers-reduced-motion:reduce){
  .ai-tile,.ai-tile img,.ai-send{transition:none!important}
  .ai-typing span,.ai-cursor{animation:none!important}
  .ai-row,.ai-tile,.ai-spark,.ai-av svg,.ai-av img,.ai-composer::before{animation:none!important}
}
</style>
<script>
// Runs before the body paints so there is no flash of the un-animated
// page - reads the one-shot marker the intro video sets right before
// navigating here, and clears it immediately so a later reload/refresh
// of this same page does not replay the entrance.
(function(){
  try {
    if (sessionStorage.getItem("ovaJustEnteredFromIntro") === "1") {
      sessionStorage.removeItem("ovaJustEnteredFromIntro");
      document.documentElement.classList.add("ova-entrance-pending");
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<div class="ai-wrap">

  <section class="ai-hero">
    <div class="ai-hero-in">
      <div class="ai-hero-kicker" id="aiKicker">MEET</div>
      <h1 class="ai-hero-title">OVA AI</h1>
      <div class="ai-hero-role" id="aiRole">YOUR PERSONAL<br>FRAGRANCE ASSISTANT</div>
      <div class="ai-hero-rule"></div>
      <p class="ai-hero-sub" id="aiSub">Discover. Ask. Find.<br>Your perfect scent,<br>made personal.</p>
      <button type="button" class="ai-hero-cta" id="aiStart">
        <span id="aiStartLabel">START CHATTING</span>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="ai-hero-tag" id="aiTag">MORE<br>THAN A SCENT</div>
  </section>

  <div class="ai-tiles">
    <button type="button" class="ai-tile light" data-en="Help me find my scent" data-ar="ساعدني ألاقي البرفان المناسب ليا">
      <img src="images/ai-agent/tile-scent.webp" alt="" loading="lazy" decoding="async">
      <span class="ai-tile-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5l1.1 3.2 3.2 1.1-3.2 1.1L12 11.1l-1.1-3.2-3.2-1.1 3.2-1.1L12 2.5z" fill="currentColor"/><path d="M18 13l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z" fill="currentColor"/></svg></span>
      <span class="ai-tile-name" data-k="t1">Find<br>My Scent</span>
      <span class="ai-tile-arw"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="ai-tile" data-en="Explain fragrance notes to me" data-ar="اشرحلي نوتات العطور">
      <img src="images/ai-agent/tile-notes.webp" alt="" loading="lazy" decoding="async">
      <span class="ai-tile-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M20 4c-9 0-14 4.5-14 10.5 0 2 .6 3.6 1.6 4.8M4 20c4-8 9-11 15-12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="ai-tile-name" data-k="t2">Explore<br>Notes</span>
      <span class="ai-tile-arw"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="ai-tile" data-en="Suggest a perfume gift" data-ar="اقترحلي هدية برفان">
      <img src="images/ai-agent/tile-gift.webp" alt="" loading="lazy" decoding="async">
      <span class="ai-tile-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11h16v9H4v-9zM3 7.5h18V11H3V7.5zM12 7.5V20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7.5S10.5 3.5 8 4.2c-2 .6-1.6 3.3 1 3.3h3zm0 0s1.5-4 4-3.3c2 .6 1.6 3.3-1 3.3h-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span class="ai-tile-name" data-k="t3">Gift<br>Suggestions</span>
      <span class="ai-tile-arw"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="ai-tile" data-en="Teach me about perfumes" data-ar="علمني عن أنواع البرفانات">
      <img src="images/ai-agent/tile-learn.webp" alt="" loading="lazy" decoding="async">
      <span class="ai-tile-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 6.5S10 4.5 6.5 4.5 3 5.5 3 5.5v13S4 17.5 6.5 17.5 12 19.5 12 19.5m0-13S14 4.5 17.5 4.5 21 5.5 21 5.5v13s-1-1-3.5-1-5.5 2-5.5 2m0-13v13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="ai-tile-name" data-k="t4">Learn About<br>Perfumes</span>
      <span class="ai-tile-arw"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
  </div>

  <div class="ai-try">
    <div class="ai-try-label" id="aiTryLabel">TRY ASKING</div>
    <div class="ai-chips" id="aiChips"></div>
  </div>

  <div class="ai-thread" id="aiThread"></div>

  <section class="ai-banner">
    <div class="ai-banner-in">
      <div class="ai-banner-t" id="aiBannerT">A smarter way<br>to experience fragrance.</div>
      <div class="ai-banner-rule"></div>
      <div class="ai-banner-s" id="aiBannerS">POWERED BY OVA AI</div>
    </div>
    <div class="ai-banner-side" id="aiBannerSide">EXPLORE<br>DISCOVER<br>BELONG</div>
  </section>

  <!-- Composer is pinned to the bottom of the viewport so it always sits
       directly under the newest message - you never scroll back up to type. -->
  <div class="ai-composer-block">
    <div class="ai-composer">
      <span class="ai-spark"><img src="images/ai-agent/agent-icon.webp?v=4ad0df87" alt="" width="34" height="34" /></span>
      <textarea class="ai-input" id="aiInput" rows="1" placeholder="Ask OVA AI anything..."></textarea>
      <button type="button" class="ai-send" id="aiSend" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 11.5L20 4.5l-7 15.5-2.3-6.2-6.2-2.3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

</div>


<script src="js/catalog.js?v=82caa220"></script>
<script src="js/remote-catalog.js?v=9816d387"></script>
<script src="js/product-details.js?v=128bc9da"></script>
<script src="js/help-assistant-v2.js?v=f7c31be5"></script>
<style>#ovaHelpFloat,#ovaHelpPanel{display:none!important}</style>
<script>
(function(){
  const isAr = () => localStorage.getItem("ovaLang") === "ar";

  const TXT = {
    en: {
      kicker:"MEET", role:"YOUR PERSONAL<br>FRAGRANCE ASSISTANT",
      sub:"Discover. Ask. Find.<br>Your perfect scent,<br>made personal.",
      start:"START CHATTING", tag:"MORE<br>THAN A SCENT",
      tryLabel:"TRY ASKING",
      chips:["Best men's perfumes?","Long lasting scents","Gifts under 1000 EGP"],
      ph:"Ask OVA AI anything...",
      bannerT:"A smarter way<br>to experience fragrance.", bannerS:"POWERED BY OVA AI",
      bannerSide:"EXPLORE<br>DISCOVER<br>BELONG",
      t1:"Find<br>My Scent", t2:"Explore<br>Notes", t3:"Gift<br>Suggestions", t4:"Learn About<br>Perfumes",
      view:"View ",
      morning:"Good morning", afternoon:"Good afternoon", evening:"Good evening", night:"Good evening",
      hi:(g)=>`${g} \u{1F642} How can I help you today?`,
      loading:"One moment, still warming up."
    },
    ar: {
      kicker:"تعرّف على", role:"مساعدك الشخصي<br>لاختيار العطور",
      sub:"اكتشف. اسأل. لاقي<br>عطرك المثالي،<br>على مزاجك إنت.",
      start:"ابدأ المحادثة", tag:"أكتر<br>من مجرد عطر",
      tryLabel:"جرّب تسأل",
      chips:["أحسن برفانات رجالي؟","برفانات ثباتها عالي","هدايا تحت 1000 جنيه"],
      ph:"اسأل OVA AI أي حاجة...",
      bannerT:"طريقة أذكى<br>تعيش بيها تجربة العطر.", bannerS:"مدعوم بـ OVA AI",
      bannerSide:"اكتشف<br>جرّب<br>انتمِ",
      t1:"لاقي<br>عطرك", t2:"استكشف<br>النوتات", t3:"اقتراحات<br>هدايا", t4:"اتعلّم عن<br>البرفانات",
      view:"افتح ",
      morning:"صباح الخير", afternoon:"مساء الخير", evening:"مساء الخير", night:"مساء الخير",
      hi:(g)=>`${g} \u{1F642} أقدر أساعدك في إيه النهاردة؟`,
      loading:"لحظة واحدة، لسه بجهّز."
    }
  };

  const T = () => TXT[isAr() ? "ar" : "en"];

  function timeKey(){
    const h = new Date().getHours();
    if (h < 5) return "night";
    if (h < 12) return "morning";
    if (h < 18) return "afternoon";
    return "evening";
  }

  const thread = document.getElementById("aiThread");
  const input  = document.getElementById("aiInput");
  const sendBtn= document.getElementById("aiSend");

  function paintText(){
    const t = T(), ar = isAr();
    document.documentElement.dir = ar ? "rtl" : "ltr";
    document.documentElement.lang = ar ? "ar" : "en";
    document.getElementById("aiKicker").textContent = t.kicker;
    document.getElementById("aiRole").innerHTML = t.role;
    document.getElementById("aiSub").innerHTML = t.sub;
    document.getElementById("aiStartLabel").textContent = t.start;
    document.getElementById("aiTag").innerHTML = t.tag;
    document.getElementById("aiTryLabel").textContent = t.tryLabel;
    document.getElementById("aiBannerT").innerHTML = t.bannerT;
    document.getElementById("aiBannerS").textContent = t.bannerS;
    document.getElementById("aiBannerSide").innerHTML = t.bannerSide;
    input.placeholder = t.ph;
    document.querySelectorAll(".ai-tile-name[data-k]").forEach((el) => {
      const k = el.getAttribute("data-k");
      if (t[k]) el.innerHTML = t[k];
    });
    document.querySelectorAll("[data-k]").forEach((el) => {
      const k = el.getAttribute("data-k");
      if (t[k] && !el.classList.contains("ai-tile-name")) el.textContent = t[k];
    });
    const chips = document.getElementById("aiChips");
    chips.innerHTML = "";
    t.chips.forEach((label) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ai-chip"; b.textContent = label;
      b.onclick = () => sendMessage(label);
      chips.appendChild(b);
    });
  }

  const down = () => window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" });
  const botIco  = '<img src="images/ai-agent/agent-icon.webp?v=4ad0df87" alt="" width="38" height="38" />';
  const userIco = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 19.5c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';

  function addUser(text){
    const r = document.createElement("div");
    r.className = "ai-row user";
    r.innerHTML = `<div class="ai-av user">${userIco}</div><div class="ai-col"><div class="ai-bub"></div></div>`;
    r.querySelector(".ai-bub").textContent = text;
    thread.appendChild(r); down();
  }

  function addTyping(){
    const r = document.createElement("div");
    r.className = "ai-row bot";
    r.innerHTML = `<div class="ai-av bot">${botIco}</div><div class="ai-col"><div class="ai-bub"><span class="ai-typing"><span></span><span></span><span></span></span></div></div>`;
    thread.appendChild(r); down();
    return r;
  }

  // Types the reply out one character at a time, ChatGPT-style.
  function stream(el, text, done){
    el.innerHTML = "";
    const cur = document.createElement("span");
    cur.className = "ai-cursor";
    let i = 0;
    (function step(){
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        el.appendChild(cur);
        i++; down();
        setTimeout(step, 13);
      } else { cur.remove(); if (done) done(); }
    })();
  }

  function prodCard(p){
    const brain = window.OvaAssistantBrain;
    const b = document.createElement("button");
    b.type = "button"; b.className = "ai-prod";
    const img = document.createElement("img");
    img.src = p.img; img.alt = p.name; img.loading = "lazy";
    const info = document.createElement("div"); info.className = "ai-prod-i";
    const nm = document.createElement("div"); nm.className = "ai-prod-n"; nm.textContent = p.name;
    const pr = document.createElement("div"); pr.className = "ai-prod-p";
    pr.textContent = (p.price || "") + (isAr() ? " ج.م" : " EGP");
    info.append(nm, pr);
    const arw = document.createElement("span");
    arw.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.append(img, info, arw);
    b.onclick = () => { if (brain && brain.go) brain.go(p); };
    return b;
  }

  function addBot(row, result){
    const col = row.querySelector(".ai-col");
    stream(col.querySelector(".ai-bub"), result.text, () => {
      (result.actions || []).forEach((a) => {
        if (a.product) { col.appendChild(prodCard(a.product)); down(); }
      });
    });
  }

  let idx = null;
  function localReply(text){
    const brain = window.OvaAssistantBrain;
    if (!brain) return { text: T().loading, actions: [] };
    if (!idx) idx = brain.collect();
    return brain.reply(text, idx);
  }
  function lookup(name){
    const brain = window.OvaAssistantBrain;
    if (!brain || !name) return null;
    if (!idx) idx = brain.collect();
    const t = String(name).trim().toLowerCase();
    return idx.find((p) => String(p.name||"").trim().toLowerCase() === t) || null;
  }

  const history = [];

  async function aiReply(text){
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ message:text, history, lang: isAr() ? "ar" : "en" })
    });
    if (!res.ok) {
      // A 429 means the assistant itself is fine but momentarily busy - the
      // customer should be told to retry, not silently handed the weaker
      // local brain's guess (which does not know live prices/stock).
      const err = new Error("api");
      err.busy = res.status === 429;
      throw err;
    }
    const data = await res.json();
    history.push({ role:"user", text });
    history.push({ role:"model", text:data.text });
    // Show a card for every product the reply named, not just the first.
    const list = Array.isArray(data.products) && data.products.length
      ? data.products
      : (data.product ? [data.product] : []);
    const actions = list.map((raw) => ({ product: lookup(raw.name) || raw }));
    return { text:data.text, actions };
  }

  async function sendMessage(text){
    const v = String(text || input.value || "").trim();
    if (!v) return;
    addUser(v);
    input.value = ""; grow(); syncSend();
    const row = addTyping();
    const wait = new Promise((r)=> setTimeout(r, 400 + Math.random()*300));
    let result;
    try { [result] = await Promise.all([aiReply(v), wait]); }
    catch(e){
      await wait;
      result = e && e.busy
        ? { text: isAr()
            ? "في زحمة أسئلة عليّا دلوقتي، هل ممكن تسأل تاني بعد كام ثانية؟ 🙏"
            : "I'm getting a lot of questions right now - mind asking again in a few seconds? 🙏",
            actions: [] }
        : localReply(v);
    }
    row.querySelector(".ai-typing").remove();
    addBot(row, result);
  }

  function grow(){ input.style.height="auto"; input.style.height = Math.min(110, input.scrollHeight)+"px"; }
  function syncSend(){ sendBtn.disabled = !input.value.trim(); }

  input.addEventListener("input", ()=>{ grow(); syncSend(); });
  input.addEventListener("keydown", (e)=>{
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  const composerEl = document.querySelector(".ai-composer");
  input.addEventListener("focus", ()=> composerEl.classList.add("is-focused"));
  input.addEventListener("blur", ()=> composerEl.classList.remove("is-focused"));
  sendBtn.addEventListener("click", ()=> sendMessage());

  document.getElementById("aiStart").addEventListener("click", ()=>{
    document.querySelector(".ai-composer-block").scrollIntoView({behavior:"smooth", block:"center"});
    setTimeout(()=> input.focus(), 400);
  });

  document.querySelectorAll(".ai-tile").forEach((tile)=>{
    tile.addEventListener("click", ()=>{
      sendMessage(isAr() ? tile.getAttribute("data-ar") : tile.getAttribute("data-en"));
    });
  });

  function greet(){
    const t = T();
    const row = addTyping();
    setTimeout(()=>{
      row.querySelector(".ai-typing").remove();
      addBot(row, { text: t.hi(t[timeKey()]), actions: [] });
    }, 420);
  }

  function boot(){ paintText(); greet(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
